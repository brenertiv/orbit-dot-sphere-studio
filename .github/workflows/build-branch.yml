name: Build dist on the preview-actions branch

# Temporary: builds and tests on this branch and commits dist/ back, because the editing
# session couldn't reach the npm registry. Remove before merging.
on:
  push:
    branches: [orbit-preview-actions]
    paths-ignore: ['dist/**']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Commit built dist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add dist
          git diff --cached --quiet && echo "dist unchanged" || (git commit -m "Build dist" && git push)
